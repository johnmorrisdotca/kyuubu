name: Release
# A version tag builds the package and attaches its tarball to a GitHub release.
# A project depends on that file at a pinned version, e.g. in package.json:
#   "@johnmorrisdotca/kyuubu": "https://github.com/johnmorrisdotca/kyuubu/releases/download/v1.0.0/johnmorrisdotca-kyuubu-1.0.0.tgz"
# Run by hand (Actions → Release → Run workflow) from main, it tags the commit
# with package.json's version itself: for a checkout that cannot push tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: The tag is the version in package.json
        run: |
          VERSION_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "$VERSION_TAG" = "$GITHUB_REF_NAME"; fi
          echo "TAG=$VERSION_TAG" >> "$GITHUB_ENV"
      - run: pnpm pack
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" ./*.tgz --title "$TAG" --notes "See CHANGELOG.md." --target "$GITHUB_SHA"
