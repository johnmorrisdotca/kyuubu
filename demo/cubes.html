<!doctype html>
<!-- The turning cubes page's source. `pnpm site` fills each "family:" line from scripts/family-template.mjs and writes site/cubes.html. -->
<html lang="en">
  <head>
    <!-- family:cubesHead -->
    <meta property="og:image" content="https://johnmorrisdotca.github.io/kyuubu/cube.png" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="kyuubu.css" />
  </head>
  <body>
    <main class="cube-page">
      <!-- family:cubesHeader -->
      <section class="fam-felt cube-felt" aria-labelledby="widget-title" data-testid="widget">
        <h2 class="cube-watch-title" id="widget-title" data-say="widgetTitle"></h2>
        <p data-say="widgetText"></p>
        <div class="cube-row" data-testid="cube-row">
          <figure><kyuubu-scramble id="widget-large" scale="large" pace="normal" theme="paper" data-testid="widget-large"></kyuubu-scramble><figcaption data-say="scaleLarge"></figcaption></figure>
          <figure><kyuubu-scramble id="widget-medium" scale="medium" pace="normal" theme="paper" size="4" data-testid="widget-medium"></kyuubu-scramble><figcaption data-say="scaleMedium"></figcaption></figure>
          <figure><kyuubu-scramble id="widget-small" scale="small" pace="normal" theme="paper" size="2" data-testid="widget-small"></kyuubu-scramble><figcaption data-say="scaleSmall"></figcaption></figure>
        </div>
      </section>

      <section class="fam-panel" aria-labelledby="pace-label">
        <div class="fam-row" data-help-en="How often the three cubes above make a turn: every half second, every second or every four seconds." data-help-ja="上の3つのキューブが回る間隔です（0.5秒ごと・1秒ごと・4秒ごと）。">
          <span class="fam-label cube-wide-label" id="pace-label" data-say="paceLabel"></span>
          <div class="fam-seg" id="paces" role="group" aria-labelledby="pace-label" data-testid="paces">
            <button type="button" data-pace="fast" aria-pressed="false" data-say="paceFast"></button>
            <button type="button" data-pace="normal" aria-pressed="true" data-say="paceNormal"></button>
            <button type="button" data-pace="slow" aria-pressed="false" data-say="paceSlow"></button>
          </div>
        </div>
        <div class="fam-actions">
          <button class="fam-button" id="widget-toggle" type="button" aria-pressed="true" data-testid="widget-toggle"></button>
        </div>
      </section>

      <section class="fam-panel" aria-labelledby="picker-title">
        <h2 id="picker-title" data-say="pickerTitle"></h2>
        <p class="fam-muted" data-say="pickerText"></p>
        <div class="cube-picker" id="picker" data-testid="picker" data-help-en="Tap a size to pick it. The line below says which one you picked." data-help-ja="サイズをタップして選びます。下の行に、選んだサイズが表示されます。"></div>
        <p class="fam-fine" id="picked" aria-live="polite" data-testid="picked"></p>
      </section>

      <section class="more" aria-labelledby="embed-title">
        <h2 id="embed-title" data-say="embedTitle"></h2>
        <p data-say="embedText"></p>
        <div class="fam-row">
          <span class="fam-label cube-wide-label" id="scale-label" data-say="embedScaleLabel"></span>
          <div class="fam-seg" id="embed-scales" role="group" aria-labelledby="scale-label" data-testid="embed-scales">
            <button type="button" data-scale="small" aria-pressed="true" data-say="scaleChoiceSmall"></button>
            <button type="button" data-scale="medium" aria-pressed="false" data-say="scaleChoiceMedium"></button>
            <button type="button" data-scale="large" aria-pressed="false" data-say="scaleChoiceLarge"></button>
          </div>
        </div>
        <h3 data-say="embedTagTitle"></h3>
        <div class="cube-example">
          <div class="cube-example-code">
            <pre><code id="embed-tag" data-testid="embed-tag"></code></pre>
            <div class="fam-actions"><button class="fam-button" type="button" data-copy="embed-tag" data-say="copy" data-testid="copy-tag"></button></div>
          </div>
          <div class="cube-example-preview" id="embed-tag-preview" data-testid="embed-tag-preview"></div>
        </div>
        <h3 data-say="embedFrameTitle"></h3>
        <div class="cube-example">
          <div class="cube-example-code">
            <pre><code id="embed-frame" data-testid="embed-frame"></code></pre>
            <div class="fam-actions"><button class="fam-button" type="button" data-copy="embed-frame" data-say="copy" data-testid="copy-frame"></button></div>
          </div>
          <div class="cube-example-preview" id="embed-frame-preview" data-testid="embed-frame-preview"></div>
        </div>
        <p class="fam-fine" id="embed-copied" aria-live="polite" data-testid="embed-copied"></p>
      </section>
      <!-- family:unreviewed -->
      <!-- family:footer -->
    </main>
    <!-- family:script -->
    <script type="module" src="cubes.js"></script>
  </body>
</html>
