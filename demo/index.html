<!doctype html>
<!-- The demo page's source. `pnpm site` fills each "family:" line from scripts/family-template.mjs, which every package in the family shares, and writes _site/index.html. -->
<html lang="en">
  <head>
    <!-- family:head -->
    <meta property="og:image" content="https://johnmorrisdotca.github.io/kyuubu/cube.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2320'/%3E%3Crect x='4' y='4' width='7' height='7' rx='1.5' fill='%23b5452c'/%3E%3Crect x='12.5' y='4' width='7' height='7' rx='1.5' fill='%23fffdf7'/%3E%3Crect x='21' y='4' width='7' height='7' rx='1.5' fill='%232f7a4f'/%3E%3Crect x='4' y='12.5' width='7' height='7' rx='1.5' fill='%23e0b43b'/%3E%3Crect x='12.5' y='12.5' width='7' height='7' rx='1.5' fill='%232b5f8f'/%3E%3Crect x='21' y='12.5' width='7' height='7' rx='1.5' fill='%23d97a2b'/%3E%3Crect x='4' y='21' width='7' height='7' rx='1.5' fill='%232f7a4f'/%3E%3Crect x='12.5' y='21' width='7' height='7' rx='1.5' fill='%23b5452c'/%3E%3Crect x='21' y='21' width='7' height='7' rx='1.5' fill='%23fffdf7'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <main>
      <!-- family:header -->
      <div class="cube-layout">
        <div class="cube-side">
          <section class="fam-felt cube-felt" aria-labelledby="hint">
            <div class="cube-hud">
              <div><small data-say="time"></small><b id="time" data-testid="time">0.00</b></div>
              <div><small data-say="moves"></small><b id="count" data-testid="count">0</b></div>
            </div>
            <div class="cube-stage" id="stage" data-testid="stage"></div>
            <p class="fam-hint" id="hint" data-testid="hint" aria-live="polite"></p>
          </section>
          <div class="fam-seg cube-sizes" id="sizes" role="group" data-say-label="size" data-testid="sizes"></div>
          <div class="cube-actions">
            <button class="fam-button" data-primary="true" id="scramble" type="button" data-say="scramble" data-testid="scramble"></button>
            <button class="fam-button" id="undo" type="button" data-say="undo" data-testid="undo"></button>
            <button class="fam-button" id="reset" type="button" data-say="reset" data-testid="reset"></button>
            <button class="fam-button" id="look" type="button" data-say="frontOn" data-testid="front-on"></button>
          </div>
        </div>

        <div class="fam-panels cube-panels">
          <div class="fam-tabs" role="tablist" id="tabs">
            <button type="button" role="tab" id="tab-solve" aria-controls="panel-solve" aria-selected="true" data-say="tabSolve"></button>
            <button type="button" role="tab" id="tab-moves" aria-controls="panel-moves" aria-selected="false" data-say="tabMoves"></button>
            <button type="button" role="tab" id="tab-save" aria-controls="panel-save" aria-selected="false" data-say="tabSave"></button>
            <button type="button" role="tab" id="tab-look" aria-controls="panel-look" aria-selected="false" data-say="tabLook"></button>
            <button type="button" role="tab" id="tab-keys" aria-controls="panel-keys" aria-selected="false" data-say="tabKeys"></button>
          </div>

          <section class="fam-panel" role="tabpanel" id="panel-solve" aria-labelledby="tab-solve">
            <p class="fam-muted" data-say="solveIntro"></p>
            <div class="fam-actions">
              <button class="fam-button" data-primary="true" id="next" type="button" data-say="nextStep" data-testid="next"></button>
              <button class="fam-button" id="all" type="button" data-say="allSteps" data-testid="all"></button>
            </div>
            <div class="cube-step" id="step" data-testid="step" aria-live="polite"></div>
            <ol class="cube-done" id="done" data-testid="done"></ol>
          </section>

          <section class="fam-panel" role="tabpanel" id="panel-moves" aria-labelledby="tab-moves" hidden>
            <form class="cube-form" id="type">
              <textarea class="fam-field cube-moves" data-mono="true" id="moves" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="R U R' U'" data-say-label="typeLabel" data-testid="moves"></textarea>
              <button class="fam-button" data-primary="true" type="submit" data-say="turn" data-testid="turn"></button>
            </form>
            <p class="fam-error" id="error" data-testid="error" aria-live="polite"></p>
            <h3 data-say="scrambleWas"></h3>
            <p class="fam-notation cube-log" id="scrambled" data-testid="scrambled"></p>
            <h3 data-say="yourMoves"></h3>
            <p class="fam-notation cube-log" id="log" data-testid="log"></p>
            <p class="fam-fine" data-say="notationHelp"></p>
          </section>

          <section class="fam-panel" role="tabpanel" id="panel-save" aria-labelledby="tab-save" hidden>
            <p class="fam-muted" data-say="saveIntro"></p>
            <textarea class="fam-field cube-text" data-mono="true" id="text" spellcheck="false" autocapitalize="off" data-say-label="saveLabel" data-testid="text"></textarea>
            <div class="fam-actions">
              <button class="fam-button" id="copy" type="button" data-say="copy" data-testid="copy"></button>
              <button class="fam-button" data-primary="true" id="load" type="button" data-say="load" data-testid="load"></button>
            </div>
            <p class="fam-fine" id="saved" data-testid="saved" aria-live="polite"></p>
            <h3 data-say="solvesTitle"></h3>
            <div id="solves" data-testid="solves"></div>
            <div class="fam-actions">
              <button class="fam-button" id="json" type="button" data-say="json" data-testid="json"></button>
              <button class="fam-button" id="csv" type="button" data-say="csv" data-testid="csv"></button>
              <button class="fam-button" data-danger="true" id="clear" type="button" data-say="clear" data-testid="clear"></button>
            </div>
          </section>

          <section class="fam-panel" role="tabpanel" id="panel-look" aria-labelledby="tab-look" hidden>
            <p class="fam-muted" data-say="lookIntro"></p>
            <div class="fam-seg" id="themes" role="group" data-say-label="themeLabel" data-testid="themes">
              <button type="button" data-theme-name="paper" data-say="themePaper"></button>
              <button type="button" data-theme-name="standard" data-say="themeStandard"></button>
              <button type="button" data-theme-name="stickerless" data-say="themeStickerless"></button>
            </div>
            <div class="cube-colours" id="colours" data-testid="colours"></div>
          </section>

          <section class="fam-panel" role="tabpanel" id="panel-keys" aria-labelledby="tab-keys" hidden>
            <div class="fam-row">
              <span class="fam-label cube-wide-label" id="speed-label" data-say="speedLabel"></span>
              <div class="fam-seg" id="speeds" role="group" aria-labelledby="speed-label" data-testid="speeds">
                <button type="button" data-ms="80" data-say="speedFast"></button>
                <button type="button" data-ms="160" data-say="speedNormal"></button>
                <button type="button" data-ms="500" data-say="speedSlow"></button>
              </div>
            </div>
            <div class="fam-table-box">
              <table>
                <thead><tr><th data-say="keysDo"></th><th data-say="keysDoes"></th></tr></thead>
                <tbody>
                  <tr><td data-say="k1"></td><td data-say="k1does"></td></tr>
                  <tr><td data-say="k2"></td><td data-say="k2does"></td></tr>
                  <tr><td data-say="k3"></td><td data-say="k3does"></td></tr>
                  <tr><td><kbd>R</kbd> <kbd>L</kbd> <kbd>U</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>B</kbd></td><td data-say="k4does"></td></tr>
                  <tr><td><kbd>M</kbd> <kbd>E</kbd> <kbd>S</kbd></td><td data-say="k5does"></td></tr>
                  <tr><td><kbd>X</kbd> <kbd>Y</kbd> <kbd>Z</kbd></td><td data-say="k6does"></td></tr>
                  <tr><td data-say="k7"></td><td data-say="k7does"></td></tr>
                  <tr><td data-say="k8"></td><td data-say="k8does"></td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
      <!-- family:unreviewed -->
      <section class="more" aria-labelledby="more-title">
        <h2 id="more-title" data-say="moreTitle"></h2>
        <p data-say="moreText"></p>
        <pre><code>npm install @johnmorrisdotca/kyuubu</code></pre>
        <pre><code>import { CubeView } from "@johnmorrisdotca/kyuubu";

new CubeView(document.getElementById("cube"), { size: 3, keyboard: "page" });</code></pre>
      </section>
      <!-- family:footer -->
    </main>
    <!-- family:script -->
    <script type="module" src="app.js"></script>
  </body>
</html>
