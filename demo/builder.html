<!doctype html>
<!-- The builder page's source. `pnpm site` fills each "family:" line from scripts/family-template.mjs and writes site/builder.html.
     Everything under the cube is made by builder.js from the package's own list of choices (`CUBE_OPTIONS`), so the page has no row of its own for an option. -->
<html lang="en">
  <head>
    <!-- family:builderHead -->
    <meta property="og:image" content="https://johnmorrisdotca.github.io/kyuubu/cube.png" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="kyuubu.css" />
  </head>
  <body>
    <main class="cube-page">
      <!-- family:builderHeader -->
      <div class="cube-layout cube-bld-layout">
        <div class="cube-side cube-bld-preview">
          <section class="fam-felt cube-felt" aria-labelledby="bld-preview-title">
            <h2 class="cube-watch-title" id="bld-preview-title" data-say="previewTitle"></h2>
            <div class="cube-bld-stage" id="bld-stage" data-testid="bld-stage"></div>
            <p class="fam-hint" id="bld-note" data-testid="bld-note" aria-live="polite"></p>
          </section>
          <div class="fam-actions">
            <button class="fam-button" id="bld-link" type="button" data-say="copyLink" data-testid="bld-link"></button>
            <button class="fam-button" id="bld-reset" type="button" data-say="startAgain" data-testid="bld-reset"></button>
          </div>
          <p class="fam-fine" id="bld-copied" data-testid="bld-copied" aria-live="polite"></p>
        </div>

        <div class="cube-bld-controls">
          <div class="fam-panel">
            <div class="fam-seg" id="bld-makers" role="group" data-say-label="makerLabel" data-testid="bld-makers">
              <button type="button" data-maker="view" data-say="makerView"></button>
              <button type="button" data-maker="player" data-say="makerPlayer"></button>
              <button type="button" data-maker="turning" data-say="makerTurning"></button>
            </div>
            <p class="fam-muted" id="bld-maker-says" data-testid="bld-maker-says"></p>
          </div>
          <div id="bld-groups" data-testid="bld-groups"></div>
        </div>
      </div>

      <section class="more cube-bld-code" aria-labelledby="bld-code-title">
        <h2 id="bld-code-title" data-say="codeTitle"></h2>
        <p data-say="codeText"></p>
        <div class="fam-tabs" role="tablist" id="bld-formats" data-testid="bld-formats"></div>
        <div id="bld-panel" role="tabpanel" data-testid="bld-panel">
          <pre><code id="bld-code" data-testid="bld-code"></code></pre>
          <div class="fam-actions"><button class="fam-button" data-primary="true" id="bld-copy" type="button" data-say="copy" data-testid="bld-copy"></button></div>
          <p class="fam-fine" id="bld-code-copied" data-testid="bld-code-copied" aria-live="polite"></p>
        </div>
      </section>
      <!-- family:unreviewed -->
      <!-- family:footer -->
    </main>
    <!-- family:script -->
    <script type="module" src="builder.js"></script>
  </body>
</html>
